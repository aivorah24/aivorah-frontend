name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:
    inputs:
      accountFilter:
        description: 'Optional comma-separated account keys to log in (e.g. "parent-e,parent-f7") - scopes E2E setup to only the accounts a targeted run needs instead of logging in all ~64. Leave blank for a full run.'
        required: false
        default: ''

env:
  # The frontend will be built and served locally on 3006
  BASE_URL: http://localhost:3006

jobs:
  build_and_setup:
    runs-on: ubuntu-latest
    # A hung setup step used to silently burn ~60 minutes with no clear
    # signal (2026-09-04, orphaned `serve` process holding the runner's
    # stdout pipe open). Cap the whole job so a stuck step fails loudly
    # instead of running until GitHub's own default timeout.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci
        
      # - name: TypeScript check
      #   run: npx tsc --noEmit
        
      # - name: Lint check
      #   run: npm run lint
        
      # - name: Unit tests
      #   run: npm run test:unit -- --ci
        
      # - name: Integration tests
      #   run: npm run test:integration -- --ci
        
      - name: Build Web Application
        run: npm run vercel-build
        
      - name: Install E2E Dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium chrome
          
      - name: Run E2E Setup (Warmup + Login + Snapshot)
        timeout-minutes: 20
        run: |
          cd e2e
          printf '%s\n' "${{ secrets.E2E_ENV_FILE }}" > .env

          # Validate required keys exist WITHOUT ever printing values.
          test -s .env || { echo "::error::e2e/.env is empty - E2E_ENV_FILE secret missing or not set"; exit 1; }
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            grep -q "^${k}=." .env || { echo "::error::E2E_ENV_FILE is missing required key ${k}"; exit 1; }
          done
          echo "[ci] .env loaded: $(wc -c < .env) bytes, $(grep -c '=' .env) keys"

          # Temporarily serve the app so setup can hit it locally. `serve` is
          # now a devDependency (was previously downloaded on the fly by
          # npx, which raced a flat `sleep 3` and caused every login to fail
          # with ERR_CONNECTION_REFUSED, 2026-09-04). Redirect its output so
          # it never holds the runner's own stdout pipe open, and kill its
          # whole process group afterward so it can't be left as an orphan -
          # both were found to hang this step for up to ~60 minutes.
          #
          # DIAGNOSTIC (2026-09-04): serve.json (cleanUrls:false) stops serve
          # from 301-redirecting /landing.html -> /landing, which server.log
          # showed being re-requested in an infinite loop. serve reads
          # serve.json from the served directory itself, not cwd.
          cp serve.json ../dist/serve.json
          npx serve -s ../dist -l 3006 > /tmp/serve.log 2>&1 &
          SERVER_PID=$!

          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3006/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::serve never became ready on :3006 after 30s"
            cat /tmp/serve.log
            pkill -P "$SERVER_PID" || true
            kill "$SERVER_PID" || true
            exit 1
          fi

          node tests/ci/setup.mjs 2>&1 | tee /tmp/setup-output.log
          SETUP_EXIT=${PIPESTATUS[0]}

          pkill -P "$SERVER_PID" || true
          kill "$SERVER_PID" || true

          exit $SETUP_EXIT
        env:
          ACCOUNT_FILTER: ${{ github.event.inputs.accountFilter }}

      # Diagnostic-only artifact: setup.mjs's own stdout (never contains
      # secret values - the script only logs account keys/emails/counts)
      # plus any failure screenshots harvestSession saved, uploaded even
      # when the setup step above failed so a hung/failed login can
      # actually be inspected instead of guessed at.
      - name: Upload Diagnostic Logs + Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-setup-diagnostics
          path: |
            /tmp/setup-output.log
            /tmp/serve.log
            e2e/.auth/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1
          
      - name: Upload Auth Session Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-session
          path: |
            e2e/.auth/
            e2e/.profile-snapshot.json
          include-hidden-files: true
          retention-days: 1

  e2e_tests:
    needs: build_and_setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install E2E Dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium chrome

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Download Auth Session Artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-session
          path: e2e/

      - name: Write env file
        run: |
          cd e2e
          printf '%s\n' "${{ secrets.E2E_ENV_FILE }}" > .env
          test -s .env || { echo "::error::e2e/.env is empty - E2E_ENV_FILE secret missing or not set"; exit 1; }

      - name: Run Playwright Shard
        run: |
          cd e2e
          npx playwright test --shard=${{ matrix.shard }}/4 --workers=2 --reporter=blob
        env:
          PLAYWRIGHT_SKIP_GLOBAL_HOOKS: 'true'

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1

  teardown_and_report:
    if: always()
    needs: [build_and_setup, e2e_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install E2E Dependencies
        run: |
          cd e2e
          npm ci

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge HTML Report
        run: |
          cd e2e
          npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Final HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Download Auth Session Artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-session
          path: e2e/

      - name: Write env file
        run: |
          cd e2e
          printf '%s\n' "${{ secrets.E2E_ENV_FILE }}" > .env
          test -s .env || { echo "::error::e2e/.env is empty - E2E_ENV_FILE secret missing or not set"; exit 1; }

      - name: Teardown Mutated Accounts
        run: |
          cd e2e
          node tests/ci/teardown.mjs
