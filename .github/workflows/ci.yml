name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check (Student persona scope)
        # Full-repo tsc still runs (so Student code that depends on shared
        # files is genuinely checked), but this only fails CI on errors
        # inside the 14 in-scope Student feature folders (+ their lesson/
        # and utils/ support code). Legacy flat screens still sitting in
        # src/screens/student/ (ReadAloudScreen, MathLessonScreen, etc.)
        # and every other persona have real pre-existing errors tracked
        # separately and don't block Student's pipeline.
        run: |
          npx tsc --noEmit > /tmp/tsc_output.txt 2>&1 || true
          SCOPE='^src/screens/student/(profile|dashboard|ai-coach|challenges|schedule|world-and-you|leaderboard|daily-habits|bedtime-stories|progress|helpCenter|learning-paths|settings|assignments|lesson|utils)/'
          IN_SCOPE=$(grep -E "$SCOPE" /tmp/tsc_output.txt | grep "error TS" || true)
          if [ -n "$IN_SCOPE" ]; then
            echo "TypeScript errors in Student persona scope:"
            echo "$IN_SCOPE"
            exit 1
          fi
          OUT_OF_SCOPE_COUNT=$(grep -c "error TS" /tmp/tsc_output.txt || true)
          echo "Student persona scope: clean. ($OUT_OF_SCOPE_COUNT pre-existing errors outside scope, not blocking.)"
      - name: Jest tests
        run: npx jest --ci --coverage=false
      # No lint step: no ESLint config exists in this repo yet. Adding one
      # and getting the codebase clean is a separate, larger task — tracked
      # as a known gap rather than faked here.
      # No build step: `expo export --platform web` needs build-time env
      # vars (API keys) this workflow doesn't have access to yet. Add once
      # Staging env vars are wired into GitHub Actions secrets.
